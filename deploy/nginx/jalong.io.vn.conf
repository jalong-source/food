# ==============================================================================
# Nginx Reverse Proxy Configuration — JaLong Food Live DB Demo
# Domains: jalong.io.vn, www.jalong.io.vn, inspector.jalong.io.vn, project.jalong.io.vn
# SSL Mode: Cloudflare Full (Strict) using Cloudflare Origin CA Certificate
# Install location (Ubuntu/Debian):
#   /etc/nginx/sites-available/jalong.io.vn.conf
#   ln -s /etc/nginx/sites-available/jalong.io.vn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jalong_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name jalong.io.vn www.jalong.io.vn inspector.jalong.io.vn project.jalong.io.vn;

    return 301 https://$host$request_uri;
}

# Main HTTPS Server — Cloudflare Full (Strict) SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jalong.io.vn www.jalong.io.vn inspector.jalong.io.vn project.jalong.io.vn;

    # --------------------------------------------------------------------------
    # Cloudflare Origin CA Certificate (Generate in Cloudflare -> SSL/TLS -> Origin Server)
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/ssl/cloudflare/jalong.io.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jalong.io.vn.key;

    # Optional: Cloudflare Authenticated Origin Pulls
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Restore Real Visitor IP from Cloudflare Proxy Ranges
    # --------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Security headers (SAMEORIGIN allows /split multi-view iframes on same domain)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # --------------------------------------------------------------------------
    # 1. Server-Sent Events (SSE) Endpoint — Real-time PG LISTEN/NOTIFY Stream
    # --------------------------------------------------------------------------
    location /api/events/stream {
        proxy_pass http://jalong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable all buffering/caching/compression so SSE frames flush immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-transform" always;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 2. WebSocket Endpoint — Bidirectional Live Telemetry (/ws)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://jalong_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. Subdomain Convenience Route: inspector.jalong.io.vn/ -> /inspector
    # --------------------------------------------------------------------------
    location = / {
        if ($host = "inspector.jalong.io.vn") {
            rewrite ^/$ /inspector last;
        }
        proxy_pass http://jalong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. Standard REST API & Frontend UI Routes (/, /admin, /inspector, /split, /api/*)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://jalong_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
